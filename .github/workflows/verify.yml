name: Verify MCT SOC Repo

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bash syntax check
        run: |
          find . -path './.git' -prune -o -name '*.sh' -type f -print | while read -r f; do bash -n "$f"; done

      - name: Python syntax check
        run: |
          find . -path './.git' -prune -o -name '*.py' -type f -print | while read -r f; do PYTHONPYCACHEPREFIX="$(mktemp -d)" python3 -m py_compile "$f"; done

      - name: ShellCheck (bash lint; installed-on-runner only)
        if: ${{ runner.os == 'Linux' }}
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            find . -path './.git' -prune -o -name '*.sh' -type f -print0 \
              | xargs -0 -r shellcheck -x -S warning -e SC1090,SC1091,SC2154,SC2086,SC2002,SC2317,SC2164,SC2162,SC2091
            echo "shellcheck done (exclusions documented in phase24-30 report)"
          else
            echo "shellcheck not available on runner - skipped (non-blocking)"
          fi
      - name: PowerShell present check
        run: |
          PS=$(find . -path './.git' -prune -o -name '*.ps1' -type f -print | wc -l)
          echo "PowerShell files present: $PS"
          if [ "$PS" -gt 0 ]; then
            echo "NOTE: PS1 scripts require endpoint/runtime validation - not executed in CI."
            echo "See scripts/endpoint-deploy/ for Windows endpoint scripts."
          fi

      - name: Stack layout check (repo-only)
        run: |
          export MCT_STACK_ROOT="$PWD"
          if [ -x scripts/verify/verify-stack-layout.sh ]; then bash scripts/verify/verify-stack-layout.sh; fi

      - name: Stale phase reference check (repo-only)
        run: |
          export MCT_STACK_ROOT="$PWD"
          if [ -x scripts/verify/verify-no-stale-phase-refs.sh ]; then bash scripts/verify/verify-no-stale-phase-refs.sh; fi

      - name: Secret pattern scan (repo-only, no values)
        run: |
          export MCT_STACK_ROOT="$PWD"
          if [ -x ops/scripts/secret-pattern-scan.sh ]; then bash ops/scripts/secret-pattern-scan.sh "$PWD"; fi

      - name: Unpinned docker image check (informational report)
        run: |
          export MCT_STACK_ROOT="$PWD"
          if [ -x ops/scripts/check-unpinned-docker-images.sh ]; then
            bash ops/scripts/check-unpinned-docker-images.sh || echo "NOTE: unpinned refs remain (backlog) - report only"
          fi

      - name: Live architecture check (SKIP in CI - requires docker stack)
        run: |
          echo "verify-current-architecture.sh requires the live docker stack and is NOT run in CI."
          echo "Run locally: bash scripts/verify/verify-current-architecture.sh"

      - name: Live portable repo check (SKIP in CI - requires creds)
        run: |
          echo "verify-portable-repo.sh requires creds.env and is NOT run in CI."
          echo "Run locally: bash scripts/verify/verify-portable-repo.sh"
