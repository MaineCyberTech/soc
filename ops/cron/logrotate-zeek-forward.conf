# Zeek-forward log rotation (Security Onion host)
# Installed: /etc/logrotate.d/zeek-forward on 192.168.222.116
# copytruncate = safe with the zeek-forward service's open file handle and the
# Wazuh logcollector position tracking.
/nsm/zeek/zeek-forward.log {
    daily
    rotate 3
    size 200M
    copytruncate
    compress
    delaycompress
    missingok
    notifempty
    create 0644 root root
}
