name: mct-security-stack

# MISP threat intelligence (official misp-docker stack).
# Images: ghcr.io/misp/misp-docker/misp-core / misp-modules + mariadb + valkey.
# UI bound to 127.0.0.1 only on the mct-soc-scan VM; remote access via SSH tunnel
# or Cloudflare Access. Mem limits tuned for a 4-6G VM.

networks:
  mct-security:
    external: true

services:
  misp-db:
    image: mariadb:10.11
    restart: unless-stopped
    command: >
      --innodb-buffer-pool-size=512M
      --innodb-change-buffering=none
      --innodb-io-capacity=1000
      --innodb-io-capacity-max=2000
      --innodb-log-file-size=256M
      --innodb-read-io-threads=8
      --innodb-write-io-threads=4
    environment:
      MYSQL_USER: misp
      MYSQL_PASSWORD: ${MISP_DB_PASSWORD:?set in .env}
      MYSQL_ROOT_PASSWORD: ${MISP_DB_ROOT_PASSWORD:?set in .env}
      MYSQL_DATABASE: misp
    volumes:
      - misp-db:/var/lib/mysql
    networks:
      - mct-security
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin --user=misp --password=$$MYSQL_PASSWORD status"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    profiles: ["misp"]

  misp-redis:
    image: valkey/valkey:7.2
    restart: unless-stopped
    command: ["valkey-server", "--requirepass", "${MISP_REDIS_PASSWORD:?set in .env}"]
    environment:
      REDIS_PASSWORD: ${MISP_REDIS_PASSWORD:?set in .env}
    volumes:
      - misp-redis:/data
    networks:
      - mct-security
    mem_limit: 128m
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    profiles: ["misp"]

  misp-modules:
    image: ghcr.io/misp/misp-docker/misp-modules:latest
    restart: unless-stopped
    networks:
      - mct-security
    mem_limit: 512m
    profiles: ["misp"]

  misp-core:
    image: ghcr.io/misp/misp-docker/misp-core@sha256:0eaa4e423d5cd965b7b76aa5665e81d5c05a35bc46a4ffec2ca52e0cfe627e86
    restart: unless-stopped
    depends_on:
      misp-db:
        condition: service_healthy
      misp-redis:
        condition: service_started
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - ./data/misp/configs:/var/www/MISP/app/Config:Z
      - ./data/misp/logs:/var/www/MISP/app/tmp/logs:Z
      - ./data/misp/files:/var/www/MISP/app/files:Z
      - ./data/misp/ssl:/etc/nginx/certs:Z
      - ./data/misp/gnupg:/var/www/MISP/.gnupg:Z
      - misp-other:/other
    environment:
      BASE_URL: ${MISP_BASEURL:?set in .env}
      ADMIN_EMAIL: ${MISP_ADMIN_EMAIL:-admin@mct.local}
      ADMIN_PASSWORD: ${MISP_ADMIN_PASSWD:?set in .env}
      ADMIN_ORG: ${MISP_ADMIN_ORG:-Maine Cyber Tech Internal}
      MYSQL_HOST: misp-db
      MYSQL_USER: misp
      MYSQL_PASSWORD: ${MISP_DB_PASSWORD:?set in .env}
      MYSQL_ROOT_PASSWORD: ${MISP_DB_ROOT_PASSWORD:?set in .env}
      MYSQL_DATABASE: misp
      REDIS_HOST: misp-redis
      REDIS_PASSWORD: ${MISP_REDIS_PASSWORD:?set in .env}
      MISP_MODULES_FQDN: http://misp-modules
      ENCRYPTION_KEY: ${MISP_ENCRYPTION_KEY:?set in .env}
      SALT: ${MISP_SALT:?set in .env}
      UUID: ${MISP_UUID:?set in .env}
      GPG_PASSPHRASE: ${MISP_GPG_PASSPHRASE:?set in .env}
      DISABLE_SSL_REDIRECT: "true"
      TZ: America/New_York
    networks:
      - mct-security
    mem_limit: 1024m
    profiles: ["misp"]

volumes:
  misp-db:
  misp-redis:
  misp-other:
