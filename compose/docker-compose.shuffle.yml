name: mct-security-stack

# Shuffle SOAR (official multi-container stack, SQLite mode).
# Images: ghcr.io/shuffle/shuffle-{frontend,backend,orborus}:latest
# SQLite mode chosen for the memory-constrained host; OpenSearch mode is the
# official default for production (see docker-compose.shuffle-opensearch notes).
# docker.sock is required by backend+orborus (Shuffle spins up app containers).

networks:
  mct-security:
    external: true
  multi-node_default:
    external: true

services:
  shuffle-frontend:
    image: ghcr.io/shuffle/shuffle-frontend@sha256:4d700a6f0822cb081822bd2fa6c633080553bdd4313aed2c4bdce75b87e82836
    container_name: shuffle-frontend
    hostname: shuffle-frontend
    ports:
      - "127.0.0.1:3001:80"
    networks:
      - mct-security
      - multi-node_default
    environment:
      - BACKEND_HOSTNAME=${SHUFFLE_BACKEND_HOSTNAME:-shuffle-backend}
    restart: unless-stopped
    depends_on:
      - shuffle-backend
    mem_limit: 256m
    profiles: ["shuffle"]

  shuffle-backend:
    image: ghcr.io/shuffle/shuffle-backend@sha256:d4a5d2bf1f956955b68b099ba1c38997e4b257b2518215e0427f433515bea5c8
    container_name: shuffle-backend
    hostname: ${SHUFFLE_BACKEND_HOSTNAME:-shuffle-backend}
    ports:
      - "127.0.0.1:5001:5001"
    networks:
      - mct-security
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/mct-security-stack/data/shuffle/apps:/shuffle-apps
      - /opt/mct-security-stack/data/shuffle/files:/shuffle-files
    environment:
      - SHUFFLE_APP_HOTLOAD_FOLDER=/shuffle-apps
      - SHUFFLE_FILE_LOCATION=/shuffle-files
      - SHUFFLE_DATABASE_TYPE=opensearch
      - SHUFFLE_OPENSEARCH_URL=http://shuffle-opensearch:9200
      - SHUFFLE_OPENSEARCH_PASSWORD=${SHUFFLE_OPENSEARCH_PASSWORD:?set in .env}
      - SHUFFLE_DEFAULT_ORG=${SHUFFLE_DEFAULT_ORG:-mct-soc}
      - SHUFFLE_DEFAULT_USER=${SHUFFLE_DEFAULT_USER:-admin}
      - SHUFFLE_DEFAULT_PASSWORD=${SHUFFLE_ADMIN_PASSWORD:?set in .env}
      - SHUFFLE_ORG_ID=${SHUFFLE_ORG_ID:-mct-soc}
      - SHUFFLE_ADMIN_USERNAME=${SHUFFLE_ADMIN_USERNAME:-admin}
      - SHUFFLE_ADMIN_PASSWORD=${SHUFFLE_ADMIN_PASSWORD:?set in .env}
      - OUTER_HOSTNAME=${SHUFFLE_BACKEND_HOSTNAME:-shuffle-backend}
      - SHUFFLE_STATS_DISABLED=true
      - SHUFFLE_LOGS_DISABLED=true
      - TZ=America/New_York
    restart: unless-stopped
    mem_limit: 768m
    profiles: ["shuffle"]

  shuffle-orborus:
    image: ghcr.io/shuffle/shuffle-orborus@sha256:94e61e7916aea28351fce3851f26f14fb85204f1567a8807d137321418366dba
    container_name: shuffle-orborus
    hostname: shuffle-orborus
    networks:
      - mct-security
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - SHUFFLE_APP_SDK_TIMEOUT=300
      - ENVIRONMENT_NAME=Shuffle
      - ORG_ID=${SHUFFLE_ORG_ID:-mct-soc}
      - BASE_URL=http://${SHUFFLE_BACKEND_HOSTNAME:-shuffle-backend}:5001
      - DOCKER_API_VERSION=1.44
      - SHUFFLE_PASS_WORKER_PROXY=${SHUFFLE_PASS_WORKER_PROXY:-true}
      - SHUFFLE_PASS_APP_PROXY=${SHUFFLE_PASS_APP_PROXY:-true}
      - SHUFFLE_STATS_DISABLED=true
      - SHUFFLE_LOGS_DISABLED=true
      - SHUFFLE_SWARM_CONFIG=run
      - CLEANUP=false
      - SHUFFLE_WORKER_IMAGE=ghcr.io/shuffle/shuffle-worker:latest
    restart: unless-stopped
    mem_limit: 384m
    profiles: ["shuffle"]

  shuffle-opensearch:
    image: opensearchproject/opensearch:3.2.0
    container_name: shuffle-opensearch
    hostname: shuffle-opensearch
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms768m -Xmx768m"
      - bootstrap.memory_lock=true
      - DISABLE_PERFORMANCE_ANALYZER_AGENT_CLI=true
      - DISABLE_SECURITY_PLUGIN=true
      - cluster.initial_master_nodes=shuffle-opensearch
      - cluster.routing.allocation.disk.threshold_enabled=false
      - cluster.name=shuffle-cluster
      - node.name=shuffle-opensearch
      - node.store.allow_mmap=false
      - discovery.seed_hosts=shuffle-opensearch
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - shuffle-database:/usr/share/opensearch/data
    networks:
      - mct-security
    restart: unless-stopped
    mem_limit: 1536m
    profiles: ["shuffle"]

volumes:
  shuffle-database:
